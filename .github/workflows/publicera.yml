# Bygger dist/ av src/ och publicerar på GitHub Pages vid varje ändring i main.
# Adoveo-sidorna laddar filerna från https://ungcancer-prod.github.io/adoveo-p2p/
# Pages cachar i ca 10 minuter, så en ändring syns på sidorna inom några minuter.
name: Bygg och publicera

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bygg CSS och JS
        run: node build/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
